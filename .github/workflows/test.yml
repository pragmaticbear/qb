name: test
on: [push, pull_request]
jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/qb/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/qb/hooks/hooks.json > /dev/null
      - name: Hook tests (all parsers)
        run: bash tests/test-hooks.sh
